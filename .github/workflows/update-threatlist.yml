name: Append IP to Blocklist

on:
  repository_dispatch:
    types: [append-threat-ip]

permissions:
  contents: write

concurrency:
  group: update-ipblocklist
  cancel-in-progress: false

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append IP with retry and rebase
        run: |
          IP="${{ github.event.client_payload.ip }}"
          if [[ ! "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid IP payload: $IP"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in {1..5}; do
            # Sync with remote before modifying the file
            git fetch origin main
            git reset --hard origin/main

            touch ipblocklist
            # Clean CRLF, trim whitespace, drop empty lines, and deduplicate
            tr -d '\r' < ipblocklist | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | awk 'NF && !seen[$0]++' > ipblocklist.tmp
            mv ipblocklist.tmp ipblocklist

            # Append only if not already present
            if ! grep -qxF "$IP" ipblocklist; then
              echo "$IP" >> ipblocklist
            fi

            if [[ -z $(git status --porcelain ipblocklist) ]]; then
              echo "$IP already exists in ipblocklist; nothing to commit."
              exit 0
            fi

            git add ipblocklist
            git commit -m "Add $IP to ipblocklist"

            if git push origin main; then
              echo "Successfully pushed $IP"
              exit 0
            fi

            echo "Push conflict on attempt $i, waiting before retry..."
            sleep $((RANDOM % 5 + 2))
          done

          echo "Failed to push after 5 attempts."
          exit 1
